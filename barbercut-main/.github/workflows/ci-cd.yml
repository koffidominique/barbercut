name: CI/CD Pipeline

on:
  push:
    branches: [main, arena/74a4924c-barbercut]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      - name: Linting (via tsc comme lint)
        run: npm run lint

  build:
    name: Build Production
    needs: lint-and-type-check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build Next.js
        run: npm run build

  deploy:
    name: Déploiement Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/74a4924c-barbercut'
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement Docker standalone
        run: |
          echo "Build standalone prêt pour déploiement Docker"
          echo "Dockerfile requis pour le déploiement complet"
